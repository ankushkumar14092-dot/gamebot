name: Autonomous CAMBC Bot Improvement Loop

on:
  schedule:
    # Run periodically every 3 hours on GitHub Cloud infrastructure
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Number of autonomous improvement cycles to execute'
        required: true
        default: '1'
        type: string
      map:
        description: 'Benchmark map path'
        required: true
        default: 'maps/ambush.map26a'
        type: string
      allow_live_submission:
        description: 'Allow live upload to official CAMBC submission platform'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'bots/submission-v6/**'
      - 'bots/submission-v9/**'

concurrency:
  group: cambc-autonomous-improver
  cancel-in-progress: false

jobs:
  autonomous-loop:
    name: Run Cloud Improvement & Benchmark Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Emergency Stop
        run: |
          if [ -f "EMERGENCY_STOP" ] || [ -f "matches/EMERGENCY_STOP" ]; then
            echo "::error ::Emergency Stop file detected! Halting autonomous improvement loop immediately."
            exit 1
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache CAMBC toolchain (wasi-sdk, cmake, ninja)
        uses: actions/cache@v4
        id: cambc-cache
        with:
          path: ~/.cache/cambc
          key: cambc-toolchain-v2.2.3-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            cambc-toolchain-v2.2.3-${{ runner.os }}-

      - name: Install CAMBC CLI and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Cloud Environment and CAMBC Toolchain
        run: |
          echo "=== CAMBC Environment Inspection ==="
          cambc --version
          echo "=== Toolchain Cache State ==="
          ls -la ~/.cache/cambc || echo "Cache directory will be created on first build"

      - name: Configure Git Identity
        run: |
          git config --global user.name "CAMBC Cloud Agent"
          git config --global user.email "cambc-agent@users.noreply.github.com"
          git config --global init.defaultBranch main


      - name: Run Pre-Flight Regression Tests
        run: |
          python -m unittest \
            tests/test_cambc_adapter.py \
            tests/test_agent_reports.py \
            tests/test_gemini_retry.py \
            tests/test_improve_bot.py \
            -v

      - name: Execute Autonomous Improvement Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          CAMBC_TEAM_ID: ${{ secrets.CAMBC_TEAM_ID }}
          CAMBC_TEAM_NAME: ${{ vars.CAMBC_TEAM_NAME || 'decrest' }}
          # Set to '1' to allow actual live platform submissions
          ALLOW_LIVE_SUBMISSION: ${{ inputs.allow_live_submission && '1' || '0' }}
        run: |
          CYCLES="${{ inputs.cycles || '1' }}"
          MAP="${{ inputs.map || 'maps/ambush.map26a' }}"
          LIVE_FLAG=""
          if [ "${{ inputs.allow_live_submission }}" = "true" ]; then
            LIVE_FLAG="--allow-live-submission"
          fi

          echo "::group::Autonomous Improvement Cycle (${CYCLES} cycles)"
          python tools/run_autonomous_agent.py run \
            --cycles "$CYCLES" \
            --map "$MAP" \
            --interval 5 \
            $LIVE_FLAG
          EXIT_CODE=$?
          echo "::endgroup::"

          # Exit code 130 = graceful emergency stop (not a failure)
          if [ "$EXIT_CODE" -eq 130 ]; then
            echo "::warning ::Agent stopped gracefully via emergency stop."
            exit 0
          fi
          exit $EXIT_CODE

      - name: Run Full Acceptance Suite
        run: |
          python -m unittest \
            tests/test_cambc_adapter.py \
            tests/test_agent_reports.py \
            tests/test_gemini_retry.py \
            tests/test_improve_bot.py \
            -v

      - name: Commit and Push Validated State to GitHub
        run: |
          git add best_version_registry.json
          git add bots/submission-v6/ bots/submission-v9/ || true
          if [ -d dist ]; then git add dist/ || true; fi
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(auto): record autonomous evaluation results [skip ci]"
            git push origin main
          fi

      - name: Upload Match Replays and Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cambc-match-artifacts-${{ github.run_id }}
          path: |
            matches/
            best_version_registry.json
            dist/
          retention-days: 14
