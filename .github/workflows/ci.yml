name: CI – Build, Test, and Verify

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CAMBC CLI
        run: python -m pip install --upgrade pip cambc==2.2.3

      - name: Configure Git identity (required by candidate branch tests)
        run: |
          git config --global user.name "CI Agent"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  acceptance-tests:
    name: Acceptance Tests (12 Criteria)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache CAMBC toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/cambc
          key: cambc-toolchain-v2.2.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install CAMBC CLI
        run: |
          python -m pip install --upgrade pip cambc==2.2.3
          git config --global user.name "CI Agent"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Smoke-test CAMBC in container
        run: |
          docker run --rm cambc-fireworks-match-agent:local cambc --version
